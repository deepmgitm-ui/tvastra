name: Fix collection image alt text

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch coverflow image alt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sections/coverflow-slider.liquid')
          s = p.read_text()
          old = '                     alt="{{ block.settings.title | escape }}" loading="lazy">'
          new = '                     alt="Tvastra Fit {{ block.settings.product_name | escape }} collection" loading="lazy">'
          if old not in s:
              raise SystemExit('Expected image alt line not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/coverflow-slider.liquid
          git commit -m "Improve homepage collection image alt text"
          git push
