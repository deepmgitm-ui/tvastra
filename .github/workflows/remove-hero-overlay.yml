name: Remove hero overlay text

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove fallback hero overlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sections/video-hero.liquid')
          s = p.read_text()
          old = '''              {%- assign hero_title = section.settings.title | default: 'Premium Activewear for Men & Women' -%}\n              <h1 class="title alt-font">{{ hero_title }}</h1>\n              {%- if section.settings.description != blank -%}\n                <p>{{ section.settings.description }}</p>\n              {%- endif -%}\n              {%- assign hero_btn_text = section.settings.btn_text | default: 'SHOP NOW' -%}\n              {%- assign hero_btn_link = section.settings.btn_link | default: routes.all_products_collection_url -%}\n              {%- render 'button-settings',\n                btn_style: section.settings.button_style,\n                btn_size: section.settings.button_size,\n                btn_text: hero_btn_text,\n                btn_link: hero_btn_link,\n                btn_radius: section.settings.btn_radius,\n                btn_border_width: section.settings.btn_border_width,\n                btn_icon_class: section.settings.btn_icon_class,\n                icon_position: section.settings.icon_position\n              -%}'''
          new = '''              {%- if section.settings.title != blank -%}\n                <div class="title alt-font">{{ section.settings.title }}</div>\n              {%- endif -%}\n              {%- if section.settings.description != blank -%}\n                <p>{{ section.settings.description }}</p>\n              {%- endif -%}\n              {%- render 'button-settings',\n                btn_style: section.settings.button_style,\n                btn_size: section.settings.button_size,\n                btn_text: section.settings.btn_text,\n                btn_link: section.settings.btn_link,\n                btn_radius: section.settings.btn_radius,\n                btn_border_width: section.settings.btn_border_width,\n                btn_icon_class: section.settings.btn_icon_class,\n                icon_position: section.settings.icon_position\n              -%}'''
          if old not in s:
              raise SystemExit('Expected hero overlay block not found; refusing to modify.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/video-hero.liquid
          git commit -m "Remove default hero overlay content"
          git push